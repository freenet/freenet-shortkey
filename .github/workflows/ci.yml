name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml pins rustc and the wasm32 target; rustup installs them on first use.
      - name: Install pinned toolchain
        run: rustup show
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace

  wasm-frozen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: rustup show
      - name: Rebuild WASM and compare with the committed artifact
        run: |
          cp wasm/freenet_shortkey_v1.wasm /tmp/committed.wasm
          ./scripts/build-wasm.sh
          if ! cmp wasm/freenet_shortkey_v1.wasm /tmp/committed.wasm; then
            echo "WASM differs from the committed generation-1 artifact." >&2
            echo "Changing it changes every resolver address. Make a new generation instead." >&2
            exit 1
          fi
