[package]
name = "freenet-shortkey-contract"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
freenet-stdlib.workspace = true
freenet-shortkey-common.workspace = true

[dev-dependencies]
blake3.workspace = true
curve25519-dalek.workspace = true
ed25519-dalek = { workspace = true, features = ["rand_core"] }
rand = "0.8.5"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# The #[contract] macro gates its WASM exports on these feature names in THIS crate.
default = ["freenet-main-contract"]
freenet-main-contract = []
contract = ["freenet-stdlib/contract"]
